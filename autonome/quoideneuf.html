<style>html,body{margin:0;min-height:100%;background:#fbfaf5;color:#2b2622;font-family:Arial,Helvetica,sans-serif}main{max-width:680px;margin:12vh auto;padding:32px;text-align:center}h1{font-family:Georgia,serif;font-weight:500}a{color:#a6432c;font-weight:bold}</style>
</head><body><main><h1>Le petit monde de Pokao</h1><p id="etat">Chargement de la dernière nouveauté…</p><p><a href="https://pokao.pages.dev/">Voir le site Pokao</a></p></main>
<script>
(function(){"use strict";
var VERSION="POKAO_AUTONOME_AFFICHAGE_V22384",UN="../data/nouveautes.json",UP="../data/nouveautes-programmees.json";
function norm(v){return String(v||"").replace(/^https?:\/\/[^/]+\//i,"").replace(/^\/+/,"");}
function nom(u){u=norm(u).split("?")[0].split("#")[0];u=u.substring(u.lastIndexOf("/")+1);return u.replace(/\.html?$/i,"")+".html";}
function paris(){var p=new Intl.DateTimeFormat("fr-CA",{timeZone:"Europe/Paris",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date()),o={};p.forEach(function(x){if(x.type!=="literal")o[x.type]=x.value;});return{date:o.year+"-"+o.month+"-"+o.day,minutes:+o.hour*60+(+o.minute)};}
function get(u,opt){return fetch(u+"?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok){if(opt)return[];throw Error(r.status);}return r.json();}).catch(function(e){if(opt)return[];throw e;});}
function calc(ns,ps){var n=paris(),b={};(ns||[]).forEach(function(i,o){if(i&&i.url)b[norm(i.url)]=Object.assign({},i,{_ordre:o});});(ps||[]).forEach(function(p,o){if(!p||!p.url||!p.date)return;var k=norm(p.url),h=String(p.heure||"07:00").match(/^(\d{2}):(\d{2})$/),m=h?+h[1]*60+(+h[2]):420,ok=p.date<n.date||(p.date===n.date&&n.minutes>=m);if(!ok){delete b[k];return;}var a=b[k]||{};b[k]=Object.assign({},a,{url:p.url,date:p.date,_ordre:-100000+o});});var v=Object.keys(b).map(function(k){return b[k];});v.sort(function(a,b){var x=String(a.date||""),y=String(b.date||"");return x!==y?(x<y?1:-1):(a._ordre||0)-(b._ordre||0);});return v;}
function show(i){return fetch("./"+nom(i.url)+"?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("copie autonome absente");return r.text();}).then(function(h){document.open();document.write(h);document.close();});}
Promise.all([get(UN,false),get(UP,true)]).then(function(x){var l=calc(x[0],x[1]);if(!l.length)throw Error("aucune nouveauté");return show(l[0]);}).catch(function(){document.getElementById("etat").textContent="La page autonome de la dernière nouveauté est momentanément indisponible.";});
}());
</script></body></html>
