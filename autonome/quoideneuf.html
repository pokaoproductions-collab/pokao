<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<title>La dernière nouveauté — POKAO</title>
<style>
html,body{margin:0;min-height:100%;background:#fbfaf5;color:#2b2622;font-family:Arial,Helvetica,sans-serif}
main{max-width:680px;margin:12vh auto;padding:32px;text-align:center}
h1{font-family:Georgia,serif;font-weight:500}
a{color:#a6432c;font-weight:bold}
</style>
</head>
<body>
<main>
  <h1>Le petit monde de Pokao</h1>
  <p id="etat">Ouverture de la dernière nouveauté…</p>
  <p><a href="https://pokao.pages.dev/">Voir le site Pokao</a></p>
</main>
<script>
(function () {
  "use strict";

  var URL_NOUVEAUTES = "../data/nouveautes.json";
  var URL_PROGRAMMATION = "../data/nouveautes-programmees.json";
  var SITE = "https://pokao.pages.dev/";

  function cleUrl(v) {
    return String(v || "").replace(/^https?:\/\/[^/]+\//i, "").replace(/^\/+/, "");
  }

  function heureParis() {
    var morceaux = new Intl.DateTimeFormat("fr-CA", {
      timeZone: "Europe/Paris",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hourCycle: "h23"
    }).formatToParts(new Date());
    var o = {};
    morceaux.forEach(function (p) { if (p.type !== "literal") o[p.type] = p.value; });
    return {
      date: o.year + "-" + o.month + "-" + o.day,
      minutes: Number(o.hour) * 60 + Number(o.minute)
    };
  }

  function getJson(url, facultatif) {
    return fetch(url + "?t=" + Date.now(), {cache:"no-store"})
      .then(function (r) {
        if (!r.ok) {
          if (facultatif) return [];
          throw new Error("HTTP " + r.status);
        }
        return r.json();
      })
      .catch(function (e) {
        if (facultatif) return [];
        throw e;
      });
  }

  function choisir(nouveautes, programmation) {
    var maintenant = heureParis();
    var plan = {};
    (programmation || []).forEach(function (p) {
      if (p && p.url) plan[cleUrl(p.url)] = p;
    });

    var visibles = (nouveautes || []).filter(function (n) {
      if (!n || !n.url) return false;
      var p = plan[cleUrl(n.url)];
      if (!p || !p.date) return true;

      var hm = String(p.heure || "07:00").match(/^(\d{2}):(\d{2})$/);
      var min = hm ? Number(hm[1]) * 60 + Number(hm[2]) : 420;
      return p.date < maintenant.date ||
             (p.date === maintenant.date && maintenant.minutes >= min);
    }).map(function (n) {
      var copie = Object.assign({}, n);
      var p = plan[cleUrl(n.url)];
      if (p && p.date) copie.date = p.date;
      return copie;
    });

    visibles.sort(function (a, b) {
      var da = String(a.date || "");
      var db = String(b.date || "");
      if (da !== db) return da < db ? 1 : -1;
      return 0;
    });
    return visibles[0] || null;
  }

  Promise.all([
    getJson(URL_NOUVEAUTES, false),
    getJson(URL_PROGRAMMATION, true)
  ]).then(function (r) {
    var active = choisir(r[0], r[1]);
    if (!active || !active.url) throw new Error("Aucune nouveauté active");
    window.location.replace(SITE + cleUrl(active.url));
  }).catch(function () {
    document.getElementById("etat").textContent =
      "La dernière nouveauté n'a pas pu être déterminée. Ouvrez le site Pokao.";
  });
}());
</script>
</body>
</html>
