<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Nouveauté POKAO</title>
  <style>
    body { font-family: Georgia, serif; max-width: 800px; margin: 60px auto; padding: 20px; color: #222; }
    h1 { font-size: 1.8em; margin-bottom: 15px; }
    p { line-height: 1.8; font-size: 1.1em; white-space: pre-line; }
    iframe {
      width: 100%;
      height: 90vh;
      border: none;
      margin-top: 20px;
      border-radius: 4px;
    }
    a.bouton {
      display: inline-block; margin-top: 20px; padding: 12px 24px;
      background: #444; color: white; text-decoration: none; border-radius: 4px;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div id="contenu"><p>Chargement…</p></div>
  <script>
    fetch("nouveaute_pokao.json?v=" + Date.now())
      .then(r => r.json())
      .then(d => {
        document.title = d.titre + " — POKAO";
        document.getElementById("contenu").innerHTML = `
          <h1>${d.titre}</h1>
          <p>${d.texte}</p>
          <iframe src="${d.lien}" allowfullscreen></iframe>
          <br>
          <a class="bouton" href="${d.lien}" target="_blank">Ouvrir en plein écran →</a>
        `;
      });
  </script>
</body>
</html>
