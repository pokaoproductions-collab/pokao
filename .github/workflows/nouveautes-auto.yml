name: Robot des nouveautés POKAO

# Tourne tout seul, sur un planning (par défaut toutes les 6h) — et
# peut aussi être lancé à la main depuis l'onglet Actions du dépôt
# (bouton "Run workflow") si vous voulez une vérification immédiate.
#
# Ce robot va chercher les informations directement sur
# https://pokao.pages.dev (sitemap.xml, puis chaque nouvelle page) :
# votre site n'a pas besoin d'être déposé sur GitHub, et votre méthode
# de déploiement (zip envoyé à la main sur Cloudflare) ne change pas.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: nouveautes-auto
  cancel-in-progress: false

jobs:
  nouveautes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r scripts/requirements.txt

      - name: Détecter les nouveautés et régénérer les fichiers
        run: python scripts/generate_nouveautes.py

      - name: Publier les changements (si nécessaire)
        run: |
          git config user.name "robot-pokao"
          git config user.email "robot-pokao@users.noreply.github.com"
          git add data/ nouveautes.xml autonome/ newsletter/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Rien à publier."    
                      else
            git commit -m "Robot : mise à jour automatique des nouveautés [skip ci]"
            git push
          fi
