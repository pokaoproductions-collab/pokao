name: Extraire nouveauté Weebly

on:
  schedule:
    - cron: '0 6 * * *'  # tous les jours à 6h
  workflow_dispatch:       # ou manuellement

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installer dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer les scripts
        run: |
          python extract.py
          python extract_pokao.py
          python extract_pokao2.py

      - name: Sauvegarder le résultat
        run: |
          git add nouveaute.json nouveaute_pokao.json nouveaute_pokao2.json
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add nouveaute.json nouveaute_pokao.json
          git diff --cached --quiet || git commit -m "Mise à jour nouveautés"
          git push
